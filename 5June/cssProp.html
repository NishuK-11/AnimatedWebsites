<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            top: 20px;
            position: relative;
        }
        .parent{
            
            height: 60px;
            width: 60px;
            color: blueviolet;
        }
        .parent p{
            position: absolute;
            font-size: 15px;
            top: 19px;
        }

    </style>
</head>
<body>
    <h1>see what happens</h1>
    <div class="parent">
        <p>Relative</p>
    </div>
    <div class="withoutParent">
        <p>Absolute</p>
    </div>
</body>
</html>
